name: CI/CD Pipeline

on: [push]

jobs:

  # ===================================================================
  # 1 BUILD
  # ===================================================================
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev zlib1g-dev

      - name: Build and Install Prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prometheus-cpp
          cd /tmp/prometheus-cpp
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j4
          sudo make install
          sudo ldconfig

      - name: Compile Code
        run: make build

      - name: Save binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker


  # ===================================================================
  # 2 TEST
  # ===================================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Make executable
        run: chmod +x prime_checker


  # ===================================================================
  # 3 PACKAGE
  # ===================================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libcurl4-openssl-dev zlib1g-dev

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Build package
        run: make package

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./prime-checker


  # ===================================================================
  # 4 DOCKER BUILD
  # ===================================================================
  docker_build_and_push:
    needs: package_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DEB
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: ./

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest


  deploy_to_k8s:
    needs: docker_build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Install tools
      # =========================
      - name: Install kubectl + kind + helm
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          curl -Lo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/

          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # =========================
      # Create cluster
      # =========================
      - name: Create Kubernetes cluster
        run: kind create cluster --name ci-cluster

      - name: Verify cluster
        run: kubectl get nodes

      # =========================
      # Load Docker image
      # =========================
      - name: Load image into kind
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest --name ci-cluster

      # =========================
      # DOWNLOAD HELM CHART (FIXED)
      # =========================
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: .

      # =========================
      # Deploy app
      # =========================
      - name: Deploy application
        run: |
          helm install prime-checker ./prime-checker \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/prime-checker \
            --set image.tag=latest

      # =========================
      # Install Prometheus
      # =========================
      - name: Install Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus prometheus-community/prometheus

      # =========================
      # Check metrics
      # =========================
      - name: Check metrics endpoint
        run: |
          kubectl port-forward svc/prime-checker-prime-checker 9090:80 &
          sleep 5
          curl http://localhost:9090/metrics | head

      # =========================
      # Cleanup
      # =========================
      - name: Delete cluster
        run: kind delete cluster --name ci-cluster