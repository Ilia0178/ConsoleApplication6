name: CI/CD Pipeline

on: [push]

jobs:

  # ===================================================================
  # 1 BUILD
  # ===================================================================
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev zlib1g-dev

      - name: Build and Install Prometheus-cpp (Latest)
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prometheus-cpp
          cd /tmp/prometheus-cpp
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j4
          sudo make install
          sudo ldconfig

      - name: Compile Code
        run: make build

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker

  # ===================================================================
  # 2 TEST
  # ===================================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary for testing
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Make sure binary is executable
        run: chmod +x prime_checker


  # ===================================================================
  # 3 PACKAGE
  # ===================================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libcurl4-openssl-dev zlib1g-dev

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Build package
        run: make package

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb

      - name: Debug Helm chart location
        run: ls -R

      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./chart/prime-checker


  # ===================================================================
  # 4 DOCKER BUILD
  # ===================================================================
  docker_build_and_push:
    needs: package_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DEB package for Docker build
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: ./

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest


  # ===================================================================
  # 5 DEPLOY TO KUBERNETES
  # ===================================================================
  deploy_to_k8s:
    needs: docker_build_and_push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      # =========================
      # Install tools
      # =========================
      - name: Install kubectl + kind + helm
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
    
          curl -Lo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/
    
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    
      # =========================
      # Create cluster
      # =========================
      - name: Create Kubernetes cluster
        run: kind create cluster --name ci-cluster
    
      # =========================
      # Verify cluster
      # =========================
      - name: Verify cluster
        run: kubectl get nodes
    
      # =========================
      # Load Docker image into kind
      # =========================
      - name: Load image into kind
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest --name ci-cluster
    
      # =========================
      # Install Helm chart (ВАЖНО: путь правильный)
      # =========================
      - name: Deploy application
        run: |
          helm install prime-checker ./chart/prime-checker \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/prime-checker \
            --set image.tag=latest
    
      # =========================
      # Wait for pods
      # =========================
      - name: Wait for pods
        run: |
          kubectl get pods
          kubectl wait --for=condition=ready pod -l app=prime-checker --timeout=120s
    
      # =========================
      # Check service
      # =========================
      - name: Check services
        run: kubectl get svc
    
      # =========================
      # TEST METRICS (CI)
      # =========================
      - name: Test metrics endpoint
        run: |
          POD=$(kubectl get pods -l app=prime-checker -o jsonpath="{.items[0].metadata.name}")
          echo "Pod: $POD"
    
          echo "=== Metrics output ==="
          kubectl exec $POD -- sh -c "wget -qO- http://localhost:9090/metrics | head"