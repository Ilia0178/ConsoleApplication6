name: CI/CD Pipeline

on: [push]

jobs:
  # ===================================================================
  # 1 BUILD
  # ===================================================================
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev zlib1g-dev
      
      - name: Build and Install Prometheus-cpp (Latest)
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prometheus-cpp
          cd /tmp/prometheus-cpp
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j4
          sudo make install
          sudo ldconfig
      
      - name: Compile Code
        run: make build 

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary 
          path: prime_checker
  # ===================================================================
  # 2 TEST
  # ===================================================================
  test_job:
    needs: build_job 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download binary for testing
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary 
          path: ./ 
          
      - name: Make sure binary is executable
        run: chmod +x prime_checker 

      - name: Install Prometheus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev
          # Если вы устанавливали prometheus-cpp через git clone/make install в build_job,
          # вам нужно повторить установку здесь или (лучше!) собирать проект с флагом -static.

  # ===================================================================
  # 3 PACKAGE
  # ===================================================================
  package_job:
    needs: test_job 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging tools and Prometheus dependencies
        run: |
          sudo apt-get update
          # dpkg-dev для самой упаковки
          # libcurl4-openssl-dev и zlib1g-dev, если они нужны для создания .deb или если бинарник динамически их требует
          sudo apt-get install -y dpkg-dev libcurl4-openssl-dev zlib1g-dev
          sudo rm -rf /var/lib/apt/lists/* # Очистка apt-кеша

      - name: Download compiled binary for packaging
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary 
          path: ./ 

      - name: Run Package (make package)
        run: |
          # make package должен использовать новый CXXFLAGS и LDFLAGS из Makefile
          make package

      - name: Upload DEB package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb 

  # ===================================================================
  # 4 DOCKER BUILD
  # ===================================================================
  docker_build_and_push:
    needs: package_job 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DEB package for Docker build
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb 
          path: ./ 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
  # ===================================================================
  # 5 DEPLOY
  # ===================================================================
  deploy_job_helm:
    name: Deploy to Kubernetes (Helm)
    needs: docker_build_and_push # Зависит от успешной сборки и пуша образа
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes credentials
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Deploy Application using Helm
        run: |
          # Ваш Helm Chart должен находиться в директории './charts/prime-checker'
          # и должен иметь возможность принимать образ и тег через --set

          # Имя вашего Helm Chart
          CHART_PATH="./charts/prime-checker"
          # Имя релиза (произвольное, но уникальное для данного приложения/окружения)
          RELEASE_NAME="prime-checker-app"
          # Namespace, куда будет развернуто приложение
          NAMESPACE="default"

          echo "Deploying application with Helm chart from $CHART_PATH"

          helm upgrade --install $RELEASE_NAME $CHART_PATH \
            --namespace $NAMESPACE \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/prime-checker \
            --set image.tag=latest \
            --timeout 5m # Таймаут для операции Helm

          # Helm upgrade --install уже ждет, пока ресурсы будут созданы/обновлены,
          # но для дополнительной уверенности можно добавить проверку rollout status
          # kubectl rollout status deployment/prime-checker-deployment --timeout=5m # Замените на имя вашего Deployment

      - name: Verify Service Availability (Optional)
        if: success() # Выполнить только если предыдущий шаг успешен
        run: |
          # Проверка доступности сервиса после Helm развертывания
          # Получаем имя сервиса из values.yaml или Chart.yaml вашего Helm Chart
          SERVICE_NAME="prime-checker-service" # Убедитесь, что это правильное имя
          NAMESPACE="default"

          EXTERNAL_IP=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          EXTERNAL_HOSTNAME=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [ -n "$EXTERNAL_IP" ]; then
            echo "Service $SERVICE_NAME is accessible at IP: $EXTERNAL_IP"
          elif [ -n "$EXTERNAL_HOSTNAME" ]; then
            echo "Service $SERVICE_NAME is accessible at Hostname: $EXTERNAL_HOSTNAME"
          else
            echo "Service $SERVICE_NAME is not of type LoadBalancer or IP/Hostname not yet assigned. Checking internal accessibility..."
          fi
