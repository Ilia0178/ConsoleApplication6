name: CI/CD Pipeline

on: [push]

jobs:

# =========================================================
# 1 BUILD
# =========================================================
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ================================
      # System dependencies
      # ================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget \
            libcurl4-openssl-dev \
            zlib1g-dev

      # ================================
      # httplib.h
      # ================================
      - name: Install httplib header
        run: |
          mkdir -p third_party
          wget -O third_party/httplib.h \
          https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h

      # ================================
      # prometheus-cpp
      # ================================
      - name: Build and install prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prom
          cd /tmp/prom
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # ================================
      # build app
      # ================================
      - name: Build app
        run: |
          make build CXXFLAGS="-Ithird_party -I/usr/local/include"

      # ================================
      # upload binary
      # ================================
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker


# =========================================================
# 2 TEST
# =========================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Make executable
        run: chmod +x prime_checker

      - name: Smoke test
        run: |
          ./prime_checker &
          sleep 2
          curl "http://localhost:8080/check?num=17" || true


# =========================================================
# 3 PACKAGE (ОПТИМИЗИРОВАННЫЙ)
# =========================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest

    steps:
      # ================================
      # Cache apt
      # ================================
      - name: Cache apt
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: apt-${{ runner.os }}

      # ================================
      # Install ONLY required tool
      # ================================
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      # ================================
      # Download binary
      # ================================
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Make executable
        run: chmod +x prime_checker

      # ================================
      # Build deb
      # ================================
      - name: Build deb package
        run: make package

      # ================================
      # Upload deb
      # ================================
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb


# =========================================================
# 4 DOCKER BUILD & PUSH
# =========================================================
  docker_build_and_push:
    needs: package_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: ./

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max