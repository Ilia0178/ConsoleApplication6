name: CI/CD Pipeline

on: [push]

jobs:

# =========================================================
# 1 BUILD
# =========================================================
  build_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev zlib1g-dev

      - name: Build Prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prom
          cd /tmp/prom && mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build app
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker


# =========================================================
# 2 TEST
# =========================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary

      - name: chmod
        run: chmod +x prime_checker

      - name: Basic test
        run: |
          echo "17" | ./prime_checker


# =========================================================
# 3 PACKAGE (DEB + HELM)
# =========================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary

      - name: Build deb
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb

      # =========================
      # IMPORTANT: HELM CHART
      # =========================
      - name: Upload Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./prime-checker


# =========================================================
# 4 DOCKER
# =========================================================
  docker_job:
    needs: package_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build & push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest


# =========================================================
# 5 DEPLOY TO K8S (kind)
# =========================================================
  deploy_job:
    needs: docker_job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # tools
      # -------------------------
      - name: Install tools
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          curl -Lo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/

          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # -------------------------
      # cluster
      # -------------------------
      - name: Create cluster
        run: kind create cluster --name ci

      # -------------------------
      # Docker image into kind
      # -------------------------
      - name: Load image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest --name ci

      # -------------------------
      # Helm chart download (FIX)
      # -------------------------
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: .

      # -------------------------
      # Helm install
      # -------------------------
      - name: Install app
        run: |
          helm install prime-checker ./prime-checker \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/prime-checker \
            --set image.tag=latest

      # -------------------------
      # Prometheus
      # -------------------------
      - name: Install Prometheus
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prom prometheus-community/prometheus

      # -------------------------
      # test metrics
      # -------------------------
      - name: Test metrics
        run: |
          kubectl get pods
          kubectl port-forward svc/prime-checker 8080:80 &
          sleep 10
          curl http://localhost:8080/metrics | head