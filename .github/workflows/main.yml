name: CI/CD Pipeline

on: [push]

jobs:

# =========================================================
# 1 BUILD
# =========================================================
  build_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev zlib1g-dev

      - name: Build and install prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prom
          cd /tmp/prom
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build app
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker


# =========================================================
# 2 TEST
# =========================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Make executable
        run: chmod +x prime_checker


# =========================================================
# 3 PACKAGE
# =========================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libcurl4-openssl-dev zlib1g-dev

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: ./

      - name: Build deb package
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb


# =========================================================
# 4 DOCKER BUILD
# =========================================================
  docker_build_and_push:
    needs: package_job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: ./

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest