name: CI/CD Pipeline

on: [push]

jobs:
# =========================================================
# 1 BUILD: Компиляция приложения
# =========================================================
  build_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget libcurl4-openssl-dev zlib1g-dev
      - name: Install httplib
        run: |
          mkdir -p third_party
          wget -O third_party/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h
      - name: Build prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prom
          cd /tmp/prom && mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j$(nproc) && sudo make install && sudo ldconfig
      - name: Build app
        run: make build CXXFLAGS="-Ithird_party -I/usr/local/include"
      - uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker

# =========================================================
# 2 TEST: Проверка работоспособности
# =========================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
      - run: chmod +x prime_checker
      - name: Smoke test
        run: |
# =========================================================
# 3 PACKAGE: Создание .deb пакета
# =========================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
      - run: chmod +x prime_checker
      - name: Build deb
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb

# =========================================================
# 4 DOCKER: Сборка с кэшированием (BuildKit + GHA Cache)
# =========================================================
  docker_build_and_push:
    needs: package_job # Этот шаг запускается только после успешного завершения package_job
    runs-on: ubuntu-latest # Используем виртуальную машину Ubuntu для сборки
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Получаем код из репозитория

      # Скачиваем бинарник prime_checker, который был собран в package_job
      # path: . означает, что файл будет сохранен в корне репозитория
      - name: Download prime_checker binary
        uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
          path: .

      # Скачиваем .deb пакет, если он тоже нужен для сборки Docker (хотя в текущем Dockerfile он не используется)
      - name: Download prime-checker .deb package
        uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: .

      # Шаг для отладки: выводит список файлов в корневой директории.
      # Используйте его, если prime_checker не находится при сборке Docker.
      - name: Debug - List files
        run: |
          echo "Files in current directory:"
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Настраиваем Docker Buildx для более эффективной сборки

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Логин пользователя Docker Hub из Secrets
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }} # Пароль/токен для Docker Hub из Secrets

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Контекст сборки - текущая директория (где находятся Dockerfile и prime_checker)
          file: ./Dockerfile # Путь к файлу Dockerfile
          push: true # Флаг, означающий, что образ нужно пушить в Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest # Тег для образа (имя пользователя/имя образа:тег)
          cache-from: type=gha # Указываем, что можем брать кэш из GitHub Actions
          cache-to: type=gha,mode=max # Указываем, что хотим сохранять кэш в GitHub Actions