name: CI/CD Pipeline

on: [push]

jobs:
# =========================================================
# 1 BUILD: Компиляция приложения
# =========================================================
  build_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget libcurl4-openssl-dev zlib1g-dev
      - name: Install httplib
        run: |
          mkdir -p third_party
          wget -O third_party/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h
      - name: Build prometheus-cpp
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git /tmp/prom
          cd /tmp/prom && mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DENABLE_PUSH=OFF
          make -j$(nproc) && sudo make install && sudo ldconfig
      - name: Build app
        run: make build CXXFLAGS="-Ithird_party -I/usr/local/include"
      - uses: actions/upload-artifact@v4
        with:
          name: prime_checker_binary
          path: prime_checker

# =========================================================
# 2 TEST: Проверка работоспособности
# =========================================================
  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
      - run: chmod +x prime_checker
      - name: Smoke test
        run: |
# =========================================================
# 3 PACKAGE: Создание .deb пакета
# =========================================================
  package_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prime_checker_binary
      - run: chmod +x prime_checker
      - name: Build deb
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: prime-checker-deb
          path: ./*.deb

# =========================================================
# 4 DOCKER: Сборка с кэшированием (BuildKit + GHA Cache)
# =========================================================
  docker_build_and_push:
    needs: package_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: prime-checker-deb
          path: .
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FOR_LOGIN }}
        
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/prime-checker:${{ github.sha }}
          # 🔥 Включаем кэширование слоев BuildKit в GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max