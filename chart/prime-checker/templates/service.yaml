apiVersion: v1
kind: Service
metadata:
  name: {{ include "prime-checker.fullname" . }}
  labels:
    {{- include "prime-checker.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: prime-checker   # 🔥 важно совпадение с Deployment

  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP