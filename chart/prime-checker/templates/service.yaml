apiVersion: v1
kind: Service
metadata:
  name: prime-checker
  labels:
    app: prime-checker
spec:
  type: {{ .Values.service.type }}

  selector:
    app: prime-checker

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics