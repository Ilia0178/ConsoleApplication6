apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-checker
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: prime-checker

  template:
    metadata:
      labels:
        app: prime-checker

    spec:
      containers:
        - name: prime-checker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - name: http
              containerPort: 8080

            - name: metrics
              containerPort: 9090

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15