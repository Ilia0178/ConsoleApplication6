apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-checker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prime-checker

  template:
    metadata:
      labels:
        app: prime-checker

    spec:
      containers:
      - name: prime-checker
        image: your_dockerhub_username/prime-checker:latest

        ports:
        - name: http
          containerPort: 8080

        - name: metrics
          containerPort: 9090

        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 30
          periodSeconds: 2

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10