apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prime-checker.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: prime-checker
  template:
    metadata:
      labels:
        app: prime-checker
    spec:
      volumes:
        - name: shared-data
          emptyDir: {}

      containers:
        - name: prime-checker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: shared-data
              mountPath: /data
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkfifo /data/input_pipe
              cat /data/input_pipe | /usr/bin/prime_checker

        - name: generator
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo $((RANDOM % 100 + 1)) > /data/input_pipe
                sleep 1
              done
          volumeMounts:
            - name: shared-data
              mountPath: /data